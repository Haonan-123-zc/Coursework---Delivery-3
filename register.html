<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .role-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        .role-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        #submitBtn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        #submitBtn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <br>
        <form id="registerForm">
            <!-- User Role Selection -->
            <label>Select Role</label>
            <div class="role-buttons">
                <button type="button" class="role-btn active" id="buyerBtn">Buyer</button>
                <button type="button" class="role-btn" id="sellerBtn">Seller</button>
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <div class="error-message" id="nameError">Full name only allows letters and spaces</div>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" placeholder="Enter your address">
                <div class="error-message" id="addressError">Address only allows letters and spaces</div>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="Enter 11-digit Chinese phone number">
                <div class="error-message" id="phoneError">Please enter a valid 11-digit Chinese phone number</div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <div class="error-message" id="emailError">Invalid email format</div>
            </div>

            <!-- Username -->
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="At least 6 letters">
                <div class="error-message" id="usernameError">Username must be at least 6 letters</div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="At least 6 letters">
                <div class="error-message" id="passwordError">Password must be at least 6 letters</div>
            </div>

            <button type="submit" id="submitBtn">Register</button>
        </form>
    </div>

    <script>
        // Get DOM elements
        const registerForm = document.getElementById('registerForm');
        const buyerBtn = document.getElementById('buyerBtn');
        const sellerBtn = document.getElementById('sellerBtn');
        const nameInput = document.getElementById('fullName');
        const addressInput = document.getElementById('address');
        const phoneInput = document.getElementById('phone');
        const emailInput = document.getElementById('email');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorElements = document.querySelectorAll('.error-message');

        // Role button switch
        buyerBtn.addEventListener('click', () => {
            buyerBtn.classList.add('active');
            sellerBtn.classList.remove('active');
        });
        sellerBtn.addEventListener('click', () => {
            sellerBtn.classList.add('active');
            buyerBtn.classList.remove('active');
        });

        // Frontend validation functions
        function validateName() {
            const regex = /^[A-Za-z\s]+$/;
            const isValid = regex.test(nameInput.value.trim());
            document.getElementById('nameError').style.display = isValid ? 'none' : 'block';
            return isValid;
        }

        function validateAddress() {
            const regex = /^[A-Za-z0-9\s]+$/;
            const isValid = regex.test(addressInput.value.trim());
            document.getElementById('addressError').style.display = isValid ? 'none' : 'block';
            return isValid;
        }

        function validatePhone() {
            const regex = /^1[3-9]\d{9}$/;
            const isValid = regex.test(phoneInput.value.trim());
            document.getElementById('phoneError').style.display = isValid ? 'none' : 'block';
            return isValid;
        }

        function validateEmail() {
            const regex = /^[^\s@]+@[^\s@]+\.(com|cn)$/;
            const isValid = regex.test(emailInput.value.trim());
            document.getElementById('emailError').style.display = isValid ? 'none' : 'block';
            return isValid;
        }

        function validateUsername() {
            const regex = /^[A-Za-z0-9]{6,}$/;
            const isValid = regex.test(usernameInput.value.trim());
            document.getElementById('usernameError').style.display = isValid ? 'none' : 'block';
            return isValid;
        }

        function validatePassword() {
            const regex = /^[A-Za-z0-9]{6,}$/;
            const isValid = regex.test(passwordInput.value.trim());
            document.getElementById('passwordError').style.display = isValid ? 'none' : 'block';
            return isValid;
        }

        // Form submission handler
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Run all validations
            const isValid = validateName() && validateAddress() && validatePhone() &&
                           validateEmail() && validateUsername() && validatePassword();

            if (!isValid) return;

            // Collect form data
            const formData = {
                role: buyerBtn.classList.contains('active') ? 'buyer' : 'seller',
                fullName: nameInput.value.trim(),
                address: addressInput.value.trim(),
                phone: phoneInput.value.trim(),
                email: emailInput.value.trim(),
                username: usernameInput.value.trim(),
                password: passwordInput.value.trim()
            };

            try {
                // Send request to PHP backend
                const response = await fetch('register_handler.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    alert(result.message);
                    registerForm.reset();
                    errorElements.forEach(msg => msg.style.display = 'none');
                    buyerBtn.classList.add('active');
                    sellerBtn.classList.remove('active');
                } else {
                    alert('Registration failed: ' + result.message);
                }
            } catch (error) {
                alert('Network error, please try again!');
                console.error('Request error:', error);
            }
        });
    </script>
</body>
</html>
