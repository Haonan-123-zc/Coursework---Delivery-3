<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car sale online - Log-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Log-in for sellers</h2>
        <form action="login.php" method="POST" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-1">username/email</label>
                <input type="text" name="login" required
                       class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Please input username/email">
            </div>
            <div>
                <label class="block text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Please input password">
            </div>
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
                Log-in at once
            </button>
        </form>
        <p class="text-center mt-4 text-gray-600">Don't possess an account？<a href="register.html" class="text-blue-600 hover:underline">立即注册</a></p>
    </div>
</body>
</html>
